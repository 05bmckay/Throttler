name: Release candidate checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: ecto://postgres:postgres@localhost/throttle_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'
      - run: mix deps.get
      - run: python3 scripts/audit_dependencies.py
      - run: mix format --check-formatted
      - run: MIX_ENV=test mix compile --warnings-as-errors
      - run: mix test
      - name: Rehearse legacy data migration
        run: |
          createdb -h localhost -U postgres throttle_readiness_upgrade
          TEST_DATABASE_URL=ecto://postgres:postgres@localhost/throttle_readiness_upgrade MIX_ENV=test mix run --no-start scripts/rehearse_upgrade.exs
      - run: MIX_ENV=prod mix compile --warnings-as-errors
      - run: MIX_ENV=prod mix release --overwrite
